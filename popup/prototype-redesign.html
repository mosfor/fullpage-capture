<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE - popup redesign variants</title>
<!--
  PROTOTYPE. Throwaway. Not shipped (not in manifest, no browser.* calls).

  Three variants of the toolbar popup, switchable via ?variant=A|B|C and the
  bottom bar. Open this file directly in a browser. The popup is rendered at
  real size inside a mock Firefox toolbar so it can be judged in context.
  The capture flow is stubbed: pick a mode, and the bar's "Delay" and
  "Outcome" controls decide whether you see the countdown and whether it
  ends in success or failure.

  Question this answers: which layout, which countdown, which success/fail
  moment, and which route to settings should the real popup adopt?

  Instrument Sans is loaded from Google Fonts for the mock only; the real
  popup would bundle the font files.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FAFAF7;
  --ink: #14161A;
  --graphite: #5B6270;
  --line: #E3E5E8;
  --wash: #F1F2F0;
  --signal: #2F6FED;
  --signal-soft: #E8EFFD;
  --confirm: #1F9D55;
  --confirm-soft: #E4F5EB;
  --fail: #D93838;
  --fail-soft: #FBE7E7;
  --lamp: #F0A020;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --font: "Instrument Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  font-size: 13px;
  color: var(--ink);
  background: #d9d9de;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
svg { display: block; }

/* ---- Mock Firefox chrome and page backdrop ---- */
.chrome {
  height: 44px; background: #f9f9fb; border-bottom: 1px solid #ccc;
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
  font-family: system-ui, sans-serif; font-size: 12px; color: #5b5b66;
}
.chrome .nav { display: flex; gap: 4px; }
.chrome .nav span { width: 28px; height: 28px; border-radius: 4px; display: grid; place-items: center; color: #8f8f9d; }
.chrome .url { flex: 1; height: 30px; background: #f0f0f4; border-radius: 6px; display: flex; align-items: center; padding: 0 12px; color: #15141a; }
.chrome .url small { color: #5b5b66; }
.chrome .tools { display: flex; gap: 4px; }
.chrome .tools span { width: 28px; height: 28px; border-radius: 4px; display: grid; place-items: center; }
.chrome .tools .ours { background: #dcdce6; }
.chrome .tools .ours i { width: 16px; height: 16px; border-radius: 4px; background: var(--signal); display: block; position: relative; }
.chrome .tools .ours i::after { content: ""; position: absolute; inset: 4px; border: 1.5px solid #fff; border-radius: 1px; }
.page { padding: 40px 120px; opacity: .55; }
.page .b { background: #fff; border-radius: 4px; margin-bottom: 14px; }
.page .b.h { height: 34px; width: 55%; }
.page .b.p { height: 12px; width: 90%; }
.page .b.p.s { width: 70%; }
.page .b.img { height: 220px; width: 100%; }

/* ---- Popup anchor (Firefox panel style) ---- */
.anchor { position: absolute; top: 48px; right: 56px; }
.popup {
  width: 300px; background: var(--paper); border-radius: 8px;
  border: 1px solid rgba(0,0,0,.14);
  box-shadow: 0 4px 16px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.1);
  overflow: hidden; position: relative;
}
@media (prefers-reduced-motion: reduce) {
  .popup *, .popup *::before, .popup *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---- Shared bits ---- */
.kbd {
  display: inline-flex; align-items: center; gap: 2px;
  font-size: 10px; font-weight: 600; color: var(--graphite); letter-spacing: .01em;
}
.kbd b { font-weight: 600; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: #fff; line-height: 1.3; }
.check-draw, .x-draw { stroke-dasharray: 1; stroke-dashoffset: 1; }
.drawn .check-draw { animation: draw .45s var(--ease-out) .1s forwards; }
.drawn .x-draw { animation: draw .3s var(--ease-out) forwards; }
.drawn .x-draw:nth-child(2) { animation-delay: .18s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
@keyframes digit-in { 0% { transform: translateY(8px) scale(.85); opacity: 0; } 100% { transform: none; opacity: 1; } }

/* Quick-settings content, shared markup, styled per variant */
.qs .opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.qs .opt label { flex: 1 1 0; min-width: 0; }
.qs .opt > :not(label) { flex: 0 0 auto; }
.qs .opt:last-of-type { border-bottom: 0; }
.qs .opt label { font-weight: 600; font-size: 12px; }
.qs .opt small { display: block; font-weight: 400; color: var(--graphite); font-size: 11px; margin-top: 2px; }
.qs select, .qs .seg { font: inherit; font-size: 12px; }
.qs select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
.qs .seg { display: inline-flex; background: var(--wash); border-radius: 6px; padding: 2px; }
.qs .seg button { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; color: var(--graphite); }
.qs .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.qs .toggle { width: 34px; height: 20px; border-radius: 10px; background: var(--line); position: relative; transition: background .2s; }
.qs .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .2s var(--ease-out); }
.qs .toggle.on { background: var(--signal); }
.qs .toggle.on::after { transform: translateX(14px); }
.qs .all { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 9px 12px; border-radius: 8px; background: var(--signal-soft); color: var(--signal); font-weight: 600; font-size: 12px; width: 100%; }
.qs .all:hover { background: #dbe6fc; }

/* ---- Prototype bar (not part of the design) ---- */
.proto-bar {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 14px; padding: 8px 10px 8px 14px;
  background: #1b1d22; color: #e8e8ec; border-radius: 999px;
  box-shadow: 0 8px 30px rgba(0,0,0,.35); font-family: system-ui, sans-serif; font-size: 12px; z-index: 50;
}
.proto-bar .arrow { width: 28px; height: 28px; border-radius: 50%; color: #fff; background: #2c2f36; font-size: 15px; }
.proto-bar .arrow:hover { background: #3a3e47; }
.proto-bar .name { min-width: 170px; text-align: center; font-weight: 600; }
.proto-bar .name small { display: block; font-weight: 400; color: #9a9fab; font-size: 11px; }
.proto-bar .sep { width: 1px; height: 22px; background: #3a3e47; }
.proto-bar .ctl { display: flex; align-items: center; gap: 6px; color: #9a9fab; }
.proto-bar .ctl button { padding: 3px 8px; border-radius: 999px; background: #2c2f36; color: #cfd2d8; font-size: 11px; }
.proto-bar .ctl button.on { background: #e8e8ec; color: #1b1d22; font-weight: 600; }
.proto-state { position: fixed; left: 50%; bottom: 66px; transform: translateX(-50%); font: 11px ui-monospace, monospace; color: #555; }

/* =====================================================================
   VARIANT A - Viewfinder
   ===================================================================== */
.va { perspective: 1200px; }
.va .card { display: grid; position: relative; transform-style: preserve-3d; transition: transform .55s var(--ease-out), height .45s var(--ease-out); }
.va.settings .card { transform: rotateY(180deg); }
.va .face { grid-area: 1 / 1; backface-visibility: hidden; padding: 12px 12px 12px; background: var(--paper); transition: visibility 0s .27s; }
.va .back { transform: rotateY(180deg); position: absolute; inset: 0; overflow: auto; visibility: hidden; }
.va.settings .back { visibility: visible; }
.va.settings .front { visibility: hidden; }
.va .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.va .head h1 { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
.va .gear { width: 26px; height: 26px; border-radius: 6px; color: var(--graphite); display: grid; place-items: center; transition: transform .4s var(--ease-out), background .15s; }
.va .gear:hover { background: var(--wash); transform: rotate(60deg); color: var(--ink); }

.va .frame {
  position: relative; height: 150px; border-radius: 6px; background: #eceded;
  overflow: hidden; transition: background .3s;
}
.va .frame .corner { position: absolute; width: 14px; height: 14px; border: 2px solid var(--ink); transition: border-color .2s, transform .3s var(--ease-out); z-index: 3; }
.va .frame .corner.tl { top: 6px; left: 6px; border-right: 0; border-bottom: 0; }
.va .frame .corner.tr { top: 6px; right: 6px; border-left: 0; border-bottom: 0; }
.va .frame .corner.bl { bottom: 6px; left: 6px; border-right: 0; border-top: 0; }
.va .frame .corner.br { bottom: 6px; right: 6px; border-left: 0; border-top: 0; }
.va.countdown .frame .corner { border-color: var(--lamp); }
.va.countdown .chip { opacity: 0; }
.va.fail .frame .corner { border-color: var(--fail); }
.va.success .frame .corner { border-color: var(--confirm); }
.va.countdown .frame .corner.tl { transform: translate(-3px,-3px); }
.va.countdown .frame .corner.tr { transform: translate(3px,-3px); }
.va.countdown .frame .corner.bl { transform: translate(-3px,3px); }
.va.countdown .frame .corner.br { transform: translate(3px,3px); }

/* the page thumbnail: wireframe of a page */
.va .thumb { position: absolute; left: 50%; top: 14px; width: 150px; transform: translateX(-50%); transition: transform .2s; }
.va .thumb .sheet { background: #fff; border-radius: 3px; padding: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.va .thumb .ln { height: 5px; border-radius: 2px; background: #d7d9db; margin-bottom: 5px; }
.va .thumb .ln.w { width: 60%; height: 8px; background: #c3c6ca; }
.va .thumb .ln.img { height: 34px; background: #dfe1e3; }
/* mode highlight over the thumbnail */
.va .hl { position: absolute; border: 2px solid var(--signal); background: rgba(47,111,237,.12); border-radius: 3px; transition: all .35s var(--ease-out); z-index: 2; pointer-events: none; }
.va .hl.dash { border-style: dashed; }
.va[data-mode="fullPage"] .hl { left: 63px; top: 14px; width: 150px; height: 200px; }
.va[data-mode="viewport"] .hl { left: 63px; top: 14px; width: 150px; height: 74px; }
.va[data-mode="region"] .hl { left: 93px; top: 44px; width: 90px; height: 50px; }
.va[data-mode="scrollRegion"] .hl { left: 93px; top: 44px; width: 90px; height: 200px; }
.va[data-mode="element"] .hl { left: 71px; top: 59px; width: 134px; height: 34px; }
.va .chip {
  position: absolute; left: 26px; bottom: 10px; z-index: 4;
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px 4px 6px;
  background: rgba(20,22,26,.86); color: #fff; border-radius: 999px; font-size: 11px; font-weight: 600;
  transition: transform .25s var(--spring), background .2s;
}
.va .chip:hover { background: var(--ink); }
.va .chip svg { width: 12px; height: 12px; }
.va .chip .caret { opacity: .6; }
.va .chip-menu { position: absolute; left: 26px; bottom: 40px; z-index: 6; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.14); padding: 4px; min-width: 130px; transform-origin: bottom left; animation: pop .18s var(--ease-out); }
.va .chip-menu button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 5px; font-size: 12px; text-align: left; }
.va .chip-menu button:hover { background: var(--wash); }
.va .chip-menu button.on { color: var(--signal); font-weight: 600; }
.va .chip-menu svg { width: 13px; height: 13px; }

/* countdown in frame */
.va .timer { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; background: rgba(236,237,237,.72); backdrop-filter: blur(1px); }
.va .timer .ring { position: absolute; width: 84px; height: 84px; }
.va .timer .ring circle { fill: none; stroke-width: 3; }
.va .timer .ring .track { stroke: rgba(240,160,32,.25); }
.va .timer .ring .arc { stroke: var(--lamp); stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; transform: rotate(-90deg); transform-origin: center; animation: drain 1s linear forwards; }
@keyframes drain { to { stroke-dashoffset: 1; } }
.va .timer .num { font-size: 44px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--lamp); letter-spacing: -.04em; animation: digit-in .25s var(--ease-out); }
.va .timer .hint { position: absolute; bottom: 10px; font-size: 11px; color: var(--graphite); }
/* flash + fly */
.va .flash { position: absolute; inset: 0; background: #fff; z-index: 7; opacity: 0; pointer-events: none; }
.va.capturing .flash { animation: flash .35s ease-out; }
@keyframes flash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
.va.success .thumb { animation: fly .6s var(--ease-out) forwards; }
@keyframes fly { to { transform: translate(calc(-50% - 70px), 45px) scale(.08); opacity: 0; } }
.va.success .hl { opacity: 0; }
.va.success .chip { animation: chip-bounce .5s var(--spring) .45s; background: var(--confirm); }
@keyframes chip-bounce { 0% { transform: scale(1); } 50% { transform: scale(1.18); } 100% { transform: scale(1); } }
.va.fail .frame { animation: shake .4s ease; }
.va.fail .frame::after { content: ""; position: absolute; inset: 0; background: rgba(217,56,56,.08); }

/* mode strip: all five visible, icon + label, sliding puck */
.va .modes { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin-top: 12px; padding: 3px; background: var(--wash); border-radius: 10px; }
.va .modes .puck { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 14px) / 5); background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.14); transition: transform .3s var(--spring); }
.va .modes button { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 2px 6px; border-radius: 8px; color: var(--graphite); font-size: 10px; font-weight: 500; letter-spacing: -.01em; transition: color .2s, transform .15s; }
.va .modes button svg { width: 16px; height: 16px; }
.va .modes button:hover { color: var(--ink); }
.va .modes button:active { transform: scale(.95); }
.va .modes button.on { color: var(--signal); font-weight: 600; }
.va .modes button.on span { color: var(--ink); }
.va .scrub-hint { margin-top: 6px; text-align: center; font-size: 10px; color: var(--graphite); opacity: .8; }

/* shutter */
.va .shutter { margin-top: 10px; position: relative; width: 100%; height: 44px; border-radius: 10px; background: var(--ink); color: #fff; font-weight: 600; font-size: 13px; overflow: hidden; transition: transform .12s, background .3s; }
.va .shutter:hover { background: #22252b; }
.va .shutter:active { transform: scale(.98); }
.va .shutter .lbl { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 10px; height: 100%; }
.va .shutter .lbl .kbd { color: rgba(255,255,255,.6); }
.va .shutter .lbl .kbd b { border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; }
.va.countdown .shutter { background: #3a3d44; }
.va.success .shutter { background: var(--confirm); }
.va.success .shutter::before { content: ""; position: absolute; inset: 0; background: rgba(255,255,255,.25); transform: translateX(-100%); animation: sweep .6s var(--ease-out) forwards; }
@keyframes sweep { to { transform: translateX(100%); } }
.va.fail .shutter { background: var(--fail); }
.va .shutter .retry { text-decoration: underline; text-underline-offset: 2px; opacity: .9; }

/* back face: settings */
.va .back .head h1 { display: flex; align-items: center; gap: 8px; }
.va .back .headback { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--graphite); }
.va .back .headback:hover { background: var(--wash); color: var(--ink); }

/* =====================================================================
   VARIANT B - Command list
   ===================================================================== */
.vb { overflow: hidden; }
.vb .pane { display: grid; position: relative; }
.vb .pane > * { grid-area: 1 / 1; transition: transform .38s var(--ease-out), opacity .3s; }
.vb .list-view { padding: 6px 0 0; }
.vb.settings .list-view { transform: translateX(-30%); opacity: 0; pointer-events: none; }
.vb .sheet { transform: translateX(100%); padding: 10px 14px 14px; background: var(--paper); position: absolute; inset: 0; overflow: auto; }
.vb.settings .sheet { transform: none; }
.vb h1 { font-size: 11px; font-weight: 600; color: var(--graphite); padding: 6px 14px 4px; }
.vb .row {
  display: grid; grid-template-columns: 26px 1fr auto; align-items: center; column-gap: 10px;
  width: 100%; padding: 8px 14px; text-align: left; position: relative; overflow: hidden;
  transition: background .15s, opacity .3s;
}
.vb .row .ic { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--signal); background: var(--signal-soft); position: relative; transition: background .3s, color .3s; }
.vb .row .ic svg { width: 15px; height: 15px; }
.vb .row .txt .name { font-size: 13px; font-weight: 600; }
.vb .row .txt .desc { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s var(--ease-out); color: var(--graphite); font-size: 11.5px; line-height: 1.35; }
.vb .row .txt .desc > span { overflow: hidden; }
.vb .row:hover, .vb .row.focus { background: var(--wash); }
.vb .row:hover .txt .desc, .vb .row.focus .txt .desc { grid-template-rows: 1fr; }
.vb .row:hover .txt .desc > span, .vb .row.focus .txt .desc > span { padding-top: 2px; }
.vb .row .end { justify-self: end; font-variant-numeric: tabular-nums; }
.vb .row .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: rgba(240,160,32,.16); transform-origin: left; transform: scaleX(1); pointer-events: none; }
.vb .row.active .bar { animation: drainbar var(--dur) linear forwards; }
@keyframes drainbar { to { transform: scaleX(0); } }
.vb .row.active { background: rgba(240,160,32,.05); }
.vb .row.active .ic { background: rgba(240,160,32,.18); color: #b8740a; }
.vb .row.active .end .num { font-size: 18px; font-weight: 600; color: #b8740a; animation: digit-in .25s var(--ease-out); display: inline-block; min-width: 14px; text-align: right; }
.vb .row.active .end .esc { font-size: 10px; color: var(--graphite); margin-left: 8px; }
.vb .row.dim { opacity: .35; pointer-events: none; }
.vb .row.done { background: var(--confirm-soft); }
.vb .row.done .ic { background: var(--confirm); color: #fff; }
.vb .row.done .ic .mode-ic { display: none; }
.vb .row.done .end { color: var(--confirm); font-weight: 600; font-size: 12px; animation: digit-in .3s var(--ease-out) .35s backwards; }
.vb .row.broke { background: var(--fail-soft); }
.vb .row.broke .ic { background: var(--fail); color: #fff; }
.vb .row.broke .ic .mode-ic { display: none; }
.vb .row.broke .txt .name { color: var(--fail); }
.vb .row.broke .txt .desc { grid-template-rows: 1fr; color: #8a2a2a; }
.vb .row.broke .end button { font-size: 12px; font-weight: 600; color: var(--fail); text-decoration: underline; text-underline-offset: 2px; }
.vb .row.broke { animation: shake .4s ease; }
.vb .row .ic .result { position: absolute; inset: 0; display: grid; place-items: center; }
.vb .row .ic .result svg { width: 15px; height: 15px; }
.vb hr { border: 0; border-top: 1px solid var(--line); margin: 6px 14px; }
.vb .dest { display: flex; align-items: center; justify-content: space-between; padding: 6px 14px; }
.vb .dest .lbl { font-size: 12px; color: var(--graphite); }
.vb .switch { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--wash); border-radius: 7px; padding: 2px; }
.vb .switch .thumb { position: absolute; top: 2px; bottom: 2px; width: calc((100% - 4px) / 3); left: 2px; background: #fff; border-radius: 5px; box-shadow: 0 1px 3px rgba(0,0,0,.12); transition: transform .28s var(--spring); }
.vb .switch button { position: relative; padding: 4px 10px; font-size: 11.5px; font-weight: 600; color: var(--graphite); border-radius: 5px; transition: color .2s; }
.vb .switch button.on { color: var(--ink); }
.vb .sub { padding: 0 14px 6px; font-size: 11px; color: var(--graphite); min-height: 20px; }
.vb .sub b { color: var(--ink); font-weight: 500; }
.vb .settings-row { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 10px 14px 12px; font-size: 13px; font-weight: 600; }
.vb .settings-row:hover { background: var(--wash); }
.vb .settings-row .chev { color: var(--graphite); transition: transform .2s; }
.vb .settings-row:hover .chev { transform: translateX(3px); }
.vb .sheet .top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.vb .sheet .top button { display: inline-flex; align-items: center; gap: 4px; color: var(--graphite); font-size: 12px; padding: 4px 6px 4px 2px; border-radius: 5px; }
.vb .sheet .top button:hover { background: var(--wash); color: var(--ink); }
.vb .sheet .top h2 { font-size: 13px; font-weight: 600; }

/* =====================================================================
   VARIANT C - Destination first
   ===================================================================== */
.vc { padding: 12px 12px 0; transition: min-height .38s var(--ease-out); }
.vc .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.vc .strip { display: inline-flex; background: var(--wash); border-radius: 8px; padding: 3px; gap: 2px; }

.vc.success .tile.chosen { border-color: var(--confirm); background: var(--confirm-soft); }

@keyframes liquid { to { transform: translateY(0); } }

@keyframes fade-icon { to { opacity: 0; transform: translateY(-6px); } }

<script>
// ---------------------------------------------------------------- data
const I = {

  scrollRegion: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><polyline points="8 14 12 18 16 14"/></svg>',
  element: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="12" height="12" rx="2"/><path d="M12 12l9 3-4 1.5L15.5 20.5z"/></svg>',
  clipboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  gear: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline class="check-draw" pathLength="1" points="20 6 9 17 4 12"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line class="x-draw" pathLength="1" x1="18" y1="6" x2="6" y2="18"/><line class="x-draw" pathLength="1" x1="6" y1="6" x2="18" y2="18"/></svg>',
  caret: '<svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>',
  back: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
};
const MODES = [
  { id: 'fullPage', name: 'Full page', label: 'Full page', short: 'Whole page, top to bottom', desc: 'The whole page, top to bottom, in one image.', key: '1' },
  { id: 'viewport', name: 'Visible area', label: 'Visible', short: 'What is on screen now', desc: 'Just what is on screen right now.', key: '2' },
  { id: 'region', name: 'Region', label: 'Region', short: 'Drag a rectangle', desc: 'Drag a rectangle over the part you want.', key: '3' },
  { id: 'scrollRegion', name: 'Scrolling region', label: 'Scrolling', short: 'Drag, then it scrolls', desc: 'Drag a rectangle, then it scrolls to capture everything below it.', key: '4' },
  { id: 'element', name: 'Element', label: 'Element', short: 'Click a block on the page', desc: 'Hover to highlight a block on the page, click to capture it.', key: '5' },
];
const DESTS = [
  { id: 'clipboard', name: 'Clipboard', hint: 'Paste with Ctrl+V', verb: 'Copy', done: 'Copied to clipboard' },
  { id: 'file', name: 'File', hint: 'Saves to Downloads', verb: 'Save', done: 'Saved to Downloads' },
  { id: 'edit', name: 'Edit', hint: 'Crop, arrow, blur first', verb: 'Edit', done: 'Opening editor' },
];
const VARIANTS = { A: 'Viewfinder', B: 'Command list', C: 'Destination first' };

// ---------------------------------------------------------------- state
const s = {
  variant: new URLSearchParams(location.search).get('variant') || 'A',
  mode: 'fullPage', dest: 'clipboard', format: 'png', saveAs: true,
  phase: 'idle', count: 0, countStart: 0, tickStart: 0,
  delay: 0, outcome: 'success', settings: false, menu: false, focusIdx: -1,
  error: "Can't capture this page",
  cardH: 0, popH: 0,
};
if (!VARIANTS[s.variant]) s.variant = 'A';
let timers = [];
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
const mode = () => MODES.find(m => m.id === s.mode);
const dest = () => DESTS.find(d => d.id === s.dest);
const filename = () => `capture-2026-09-04-14-22-05.${s.format === 'jpeg' ? 'jpg' : s.format}`;
const kbd = (k) => `<span class="kbd"><b>Alt</b><b>Shift</b><b>${k}</b></span>`;

// ---------------------------------------------------------------- flow (stub)
function trigger(modeId, destId) {
  if (s.phase !== 'idle') return;
  s.mode = modeId; if (destId) s.dest = destId; s.menu = false; s.settings = false;
  if (s.delay > 0) {
    s.phase = 'countdown'; s.count = s.delay; s.countStart = s.tickStart = Date.now();
    render(); tick();
  } else capture();
}
function tick() {
  timers.push(setTimeout(() => {
    s.count--; s.tickStart = Date.now();
    if (s.count > 0) { render(); tick(); } else capture();
  }, 1000));
}
function capture() {
  s.phase = 'capturing'; render();
  timers.push(setTimeout(() => {
    s.phase = s.outcome; render();
    if (s.outcome === 'success') timers.push(setTimeout(reset, 1900));
  }, 650));
}
function cancel() { clearTimers(); s.phase = 'idle'; render(); }
function reset() { clearTimers(); s.phase = 'idle'; render(); }
const busy = () => s.phase !== 'idle';

// ---------------------------------------------------------------- shared quick settings
function quickSettings(opts = {}) {
  const seg = (items, cur, attr) => `<div class="seg">${items.map(([v, l]) => `<button data-${attr}="${v}" class="${v == cur ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  return `<div class="qs">
    ${opts.dest === false ? '' : `<div class="opt"><label>Send to<small>Where captures go</small></label>${seg(DESTS.map(d => [d.id, d.name]), s.dest, 'set-dest')}</div>`}
    <div class="opt"><label>File format<small>Clipboard is always PNG</small></label>${seg([['png','PNG'],['jpeg','JPEG'],['pdf','PDF']], s.format, 'set-format')}</div>
    <div class="opt"><label>Delay<small>Time to open menus first</small></label>${seg([['0','Off'],['3','3s'],['5','5s'],['10','10s']], s.delay, 'set-delay')}</div>
    <div class="opt"><label>Ask where to save</label><button class="toggle ${s.saveAs ? 'on' : ''}" data-act="toggle-saveas" aria-pressed="${s.saveAs}"></button></div>
    <div class="opt"><label>File name<small>${filename()}</small></label></div>
    <button class="all" data-act="all-settings">All settings <span>&#8250;</span></button>
  </div>`;
}

// ---------------------------------------------------------------- A - Viewfinder
function renderA() {
  const m = mode(), d = dest();
  const frac = ((Date.now() - s.tickStart) / 1000).toFixed(2);
  const timer = s.phase === 'countdown' ? `

      <svg class="ring" viewBox="0 0 84 84"><circle class="track" cx="42" cy="42" r="39"/><circle class="arc" cx="42" cy="42" r="39" pathLength="1" style="animation-delay:-${frac}s"/></svg>

    idle: `Capture ${m.name.toLowerCase()} ${kbd(m.key)}`,
    countdown: `Set up the page…`,
    capturing: `Capturing…`,
    success: d.done,
    fail: `${s.error} <span class="retry" data-act="retry">Retry</span>`,
  }[s.phase];
  return `<div class="popup va ${s.phase} ${s.settings ? 'settings' : ''}" data-mode="${s.mode}">
   <div class="card" style="${s.cardH ? `height:${s.cardH}px` : ''}">
    <div class="face front">
      <div class="head"><h1>FullPage Capture</h1><button class="gear" data-act="settings" title="Settings">${I.gear}</button></div>
      <div class="frame" data-scrub>

        </div></div>

        ${s.menu ? `<div class="chip-menu">${DESTS.map(x => `<button data-set-dest="${x.id}" class="${x.id === s.dest ? 'on' : ''}">${I[x.id]} ${x.name}</button>`).join('')}</div>` : ''}

      <div class="modes" data-scrub>
        <div class="puck" style="transform:translateX(calc(${MODES.findIndex(x => x.id === s.mode)} * (100% + 2px)))"></div>

      </div>
      <button class="shutter" data-act="shutter" ${busy() && s.phase !== 'fail' ? 'disabled' : ''}><span class="lbl">${shutter}</span></button>
    </div>
    <div class="face back">
      <div class="head"><h1><button class="headback" data-act="settings" title="Back">${I.back}</button> Settings</h1></div>

    </div>

  </div>`;
}
function sizePopupC() {
  const pop = document.querySelector('.vc'); if (!pop) return;
  const target = s.settings ? pop.querySelector('.bsheet').scrollHeight : 0;
  if (target !== s.popH) requestAnimationFrame(() => { pop.style.minHeight = target ? target + 'px' : ''; s.popH = target; });
}
function sizeCardA() {
  const card = document.querySelector('.va .card'); if (!card) return;
  const target = s.settings ? card.querySelector('.back').scrollHeight : card.querySelector('.front').offsetHeight;
  if (target !== s.cardH) { requestAnimationFrame(() => { card.style.height = target + 'px'; s.cardH = target; }); }
}

// ---------------------------------------------------------------- B - Command list
function renderB() {
  const d = dest();
  const elapsed = ((Date.now() - s.countStart) / 1000).toFixed(2);
  const rows = MODES.map((m, i) => {
    const isTarget = busy() && m.id === s.mode;
    const cls = [
      isTarget && (s.phase === 'countdown' || s.phase === 'capturing') ? 'active' : '',
      isTarget && s.phase === 'success' ? 'done' : '',
      isTarget && s.phase === 'fail' ? 'broke' : '',

      i === s.focusIdx && !busy() ? 'focus' : '',
    ].join(' ');
    const end = isTarget ? ({
      countdown: `<span class="num">${s.count}</span><span class="esc">Esc</span>`,
      capturing: `<span class="num">…</span>`,
      success: d.done,
      fail: `<button data-act="retry">Retry</button>`,
    })[s.phase] : kbd(m.key);
    const result = s.phase === 'success' && isTarget ? `<div class="result drawn">${I.check}</div>` : s.phase === 'fail' && isTarget ? `<div class="result drawn">${I.x}</div>` : '';
    return `<div class="row ${cls}" role="button" tabindex="0" data-trigger-mode="${m.id}" style="--dur:${s.delay}s">

      <div class="end">${end}</div>

  }).join('');
  const idx = DESTS.findIndex(x => x.id === s.dest);
  const sub = { clipboard: 'Paste with <b>Ctrl+V</b>', file: `Saves as <b>${filename()}</b>`, edit: 'Opens in the editor to crop, blur, annotate' }[s.dest];
  return `<div class="popup vb ${s.phase} ${s.settings ? 'settings' : ''}">

      <div class="sub">${sub}</div>
      <hr>
      <button class="settings-row" data-act="settings">Settings <span class="chev">&#8250;</span></button>
    </div>

   </div>
  </div>`;
}

// ---------------------------------------------------------------- C - Destination first
function renderC() {
  const m = mode();
  const frac = ((Date.now() - s.tickStart) / 1000).toFixed(2);
  const tiles = DESTS.map(d => {
    const chosen = busy() && d.id === s.dest;
    const name = chosen && s.phase === 'success' ? d.done : chosen && s.phase === 'fail' ? "Didn't work" : chosen && s.phase === 'capturing' ? 'Capturing…' : d.name;
    const hintA = chosen && s.phase === 'countdown' ? 'Set up the page. Esc cancels.' : chosen && s.phase === 'fail' ? `${s.error}.<span class="retry" role="button" tabindex="0" data-act="retry">Retry</span>` : d.hint;
    const res = chosen && s.phase === 'success' ? I.check : chosen && s.phase === 'fail' ? I.x : '';
    return `<button class="tile ${chosen ? 'chosen' : ''}" data-dest="${d.id}" ${busy() && !chosen ? 'tabindex="-1"' : ''}>
      <div class="big">${s.count}</div>
      <svg class="ring" viewBox="0 0 48 48"><circle class="track" cx="24" cy="24" r="22"/><circle class="arc" cx="24" cy="24" r="22" pathLength="1" style="animation-delay:-${frac}s"/></svg>
      <div class="ic"><div class="fill"></div>${I[d.id]}<div class="res ${res ? 'drawn' : ''}">${res}</div></div>
      <div class="name">${name}</div>
      <div class="hint"><span class="a">${hintA}</span><span class="b">${d.verb} ${m.name.toLowerCase()}</span></div>
    </button>`;
  }).join('');
  return `<div class="popup vc ${s.phase} ${busy() ? 'busy' : ''} ${s.settings ? 'settings' : ''}" style="${s.popH ? `min-height:${s.popH}px` : ''}">
    <div class="head">
      <div class="strip">${MODES.map(x => `<button data-select-mode="${x.id}" class="${x.id === s.mode ? 'on' : ''}" title="${x.name}">${I[x.id]}</button>`).join('')}</div>
      <div class="modename">${m.name}<small>${m.short}</small></div>
    </div>
    <div class="tiles">${tiles}</div>
    <div class="foot"><button data-act="settings">${I.gear} Settings</button>${kbd(m.key)}</div>
    <div class="scrim" data-act="settings"></div>
    <div class="bsheet"><div class="grab"></div><h2>Settings</h2>${quickSettings({ dest: false })}</div>
  </div>`;
}

// ---------------------------------------------------------------- render + wiring
const root = document.getElementById('root');
function render() {
  root.innerHTML = { A: renderA, B: renderB, C: renderC }[s.variant]();
  if (s.variant === 'A') sizeCardA();
  if (s.variant === 'C') sizePopupC();
  document.getElementById('vname').innerHTML = `${s.variant}<small>${VARIANTS[s.variant]}</small>`;
  document.querySelectorAll('.proto-bar [data-set-delay]').forEach(b => b.classList.toggle('on', +b.dataset.setDelay === +s.delay));
  document.querySelectorAll('.proto-bar [data-set-outcome]').forEach(b => b.classList.toggle('on', b.dataset.setOutcome === s.outcome));
  document.getElementById('pstate').textContent =
    `variant=${s.variant} mode=${s.mode} dest=${s.dest} phase=${s.phase}${s.phase === 'countdown' ? ' count=' + s.count : ''} settings=${s.settings} delay=${s.delay}s outcome=${s.outcome} format=${s.format}`;
}
function setVariant(v) {
  clearTimers(); s.phase = 'idle'; s.settings = false; s.menu = false; s.focusIdx = -1; s.cardH = 0; s.popH = 0;
  s.variant = v;
  const u = new URL(location); u.searchParams.set('variant', v); history.replaceState(null, '', u);
  render();
}
const keys = Object.keys(VARIANTS);
const step = (n) => setVariant(keys[(keys.indexOf(s.variant) + n + keys.length) % keys.length]);
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-select-mode],[data-trigger-mode],[data-dest],[data-set-dest],[data-set-delay],[data-set-outcome],[data-set-format]');
  const inPopup = e.target.closest('.popup');
  if (!t) { if (s.menu) { s.menu = false; render(); } return; }
  const d = t.dataset;
  if (d.act === 'chipmenu') { s.menu = !s.menu; return render(); }
  if (s.menu && !('setDest' in d)) s.menu = false;
  if (d.act === 'settings') { s.settings = !s.settings; return render(); }
  if (d.act === 'all-settings') { alert('Would open the full options page (options/options.html) in a new tab.'); return; }
  if (d.act === 'toggle-saveas') { s.saveAs = !s.saveAs; return render(); }
  if (d.act === 'retry') { reset(); return trigger(s.mode); }
  if (d.act === 'shutter') { if (s.phase === 'fail') { reset(); } return trigger(s.mode); }
  if ('selectMode' in d) { s.mode = d.selectMode; return render(); }
  if ('triggerMode' in d) { if (busy()) return; return trigger(d.triggerMode); }
  if ('dest' in d) { if (busy()) return; return trigger(s.mode, d.dest); }
  if ('setDest' in d) { s.dest = d.setDest; return render(); }
  if ('setDelay' in d) { s.delay = +d.setDelay; return render(); }
  if ('setOutcome' in d) { s.outcome = d.setOutcome; return render(); }
  if ('setFormat' in d) { s.format = d.setFormat; return render(); }
});
// Wheel over the frame or the mode strip scrubs modes (A). Accumulate to a
// threshold and add a cooldown so one physical notch (which Firefox may
// deliver as several events, or in line units) moves exactly one step.
let scrubAcc = 0, scrubLast = 0;
document.addEventListener('wheel', (e) => {
  if (!e.target.closest('[data-scrub]') || busy() || s.settings) return;
  e.preventDefault();
  const raw = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  scrubAcc += e.deltaMode === 1 ? raw * 16 : e.deltaMode === 2 ? raw * 100 : raw;
  if (Math.abs(scrubAcc) < 40) return;
  const dir = Math.sign(scrubAcc); scrubAcc = 0;
  if (Date.now() - scrubLast < 220) return;
  scrubLast = Date.now();
  const i = MODES.findIndex(m => m.id === s.mode);
  const n = Math.max(0, Math.min(MODES.length - 1, i + dir));
  if (n !== i) { s.mode = MODES[n].id; render(); }
}, { passive: false });

document.addEventListener('keydown', (e) => {
  const tag = (document.activeElement || {}).tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const focusInPopup = !!document.activeElement.closest?.('.popup');
  if (e.key === 'Escape') {
    if (s.phase === 'countdown') return cancel();
    if (s.phase === 'fail') return reset();
    if (s.menu || s.settings) { s.menu = false; s.settings = false; return render(); }
    return;
  }
  if (/^[1-5]$/.test(e.key) && !busy() && !s.settings) return trigger(MODES[+e.key - 1].id);
  const i = MODES.findIndex(m => m.id === s.mode);
  if (s.variant === 'A' && focusInPopup && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !busy()) {
    e.preventDefault(); s.mode = MODES[Math.max(0, Math.min(4, i + (e.key === 'ArrowRight' ? 1 : -1)))].id; return render();
  }
  if (s.variant === 'B' && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && !busy()) {
    e.preventDefault(); s.focusIdx = (s.focusIdx + (e.key === 'ArrowDown' ? 1 : -1) + 5) % 5; return render();
  }
  if (s.variant === 'B' && e.key === 'Enter' && s.focusIdx >= 0 && !busy()) return trigger(MODES[s.focusIdx].id);
  if (s.variant === 'C' && focusInPopup && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !busy()) {
    e.preventDefault(); s.mode = MODES[Math.max(0, Math.min(4, i + (e.key === 'ArrowRight' ? 1 : -1)))].id; return render();
  }
  if (!focusInPopup && e.key === 'ArrowLeft') return step(-1);
  if (!focusInPopup && e.key === 'ArrowRight') return step(1);
});
render();
// Shareable states for review: ?demo=countdown|success|fail|settings
// (countdown pauses at 2 so screenshots are stable).
const demo = new URLSearchParams(location.search).get('demo');
if (demo === 'settings') { s.settings = true; render(); }
if (demo === 'countdown') { s.delay = 3; trigger(s.mode, s.variant === 'C' ? s.dest : null); clearTimers(); s.count = 2; render(); }
if (demo === 'success' || demo === 'fail') { s.outcome = demo; trigger(s.mode, s.variant === 'C' ? s.dest : null); clearTimers(); s.phase = demo; render(); }
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 13px;
      background: #fff;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 700;
      color: #1a1a1a;
    }
    .output-toggle {
      display: flex;
      background: #f1f3f5;
      border-radius: 6px;
      padding: 2px;
    }
    .output-toggle button {
      border: none;
      background: none;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      color: #666;
      font-weight: 500;
    }
    .output-toggle button.active {
      background: #fff;
      color: #1a1a1a;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .capture-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 14px 8px;
      border: 1.5px solid #e8eaed;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      transition: all 0.15s;
    }
    .capture-btn:hover {
      border-color: #4A90D9;
      background: #f7faff;
    }
    .capture-btn:active {
      transform: scale(0.97);
    }
    .capture-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .capture-btn:disabled:hover {
      border-color: #e8eaed;
      background: #fff;
    }
    .capture-btn .icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .capture-btn .icon svg {
      width: 22px;
      height: 22px;
      color: #4A90D9;
    }
    .capture-btn .label {
      font-size: 11px;
      font-weight: 600;
      color: #333;
      text-align: center;
    }
    .capture-btn .shortcut {
      font-size: 9px;
      color: #999;
      font-weight: 400;
    }
    /* Success / Error overlay */
    .overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 30px 0;
    }
    .overlay.show { display: flex; }
    .overlay .icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop 0.3s ease;
    }
    .overlay .icon-circle svg {
      width: 24px;
      height: 24px;
    }
    .overlay .msg {
      font-size: 13px;
      font-weight: 600;
    }
    .overlay.success .icon-circle { background: #e8f5e9; }
    .overlay.success .icon-circle svg { color: #2e7d32; }
    .overlay.success .msg { color: #2e7d32; }
    .overlay.error .icon-circle { background: #fdecea; }
    .overlay.error .icon-circle svg { color: #d32f2f; }
    .overlay.error .msg { color: #d32f2f; }
    .status-text {
      text-align: center;
      margin-top: 10px;
      min-height: 16px;
      font-size: 12px;
      color: #666;
    }
    @keyframes pop {
      0% { transform: scale(0); }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Capture</h1>
    <div class="output-toggle" id="outputToggle">
      <button data-value="clipboard" class="active">Clipboard</button>
      <button data-value="file">File</button>
    </div>
  </div>

  <div class="grid" id="grid">
    <button class="capture-btn" id="fullPageBtn">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="3" y1="15" x2="21" y2="15"/>
        </svg>
      </div>
      <span class="label">Full Page</span>
      <span class="shortcut">Alt+Shift+1</span>
    </button>
    <button class="capture-btn" id="viewportBtn">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
        </svg>
      </div>
      <span class="label">Visible Area</span>
      <span class="shortcut">Alt+Shift+2</span>
    </button>
    <button class="capture-btn" id="regionBtn">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 3h4M15 3h4M3 5v4M21 5v4M3 15v4M21 15v4M5 21h4M15 21h4"/>
        </svg>
      </div>
      <span class="label">Select Region</span>
      <span class="shortcut">Alt+Shift+3</span>
    </button>
    <button class="capture-btn" id="scrollRegionBtn">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="2"/>
          <polyline points="8 14 12 18 16 14"/>
        </svg>
      </div>
      <span class="label">Scrolling</span>
      <span class="shortcut">Alt+Shift+4</span>
    </button>
  </div>

  <div class="overlay" id="overlay">
    <div class="icon-circle">
      <svg id="overlayCheckIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <svg id="overlayErrorIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </div>
    <span class="msg" id="overlayMsg"></span>
  </div>

  <div class="status-text" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>

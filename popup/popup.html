<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="popup" id="app" data-mode="fullPage">
  <div class="card" id="card">

    <section class="face front">
      <header>
        <h1>FullPage Capture</h1>
        <button class="iconbtn gear" id="settingsBtn" title="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </header>

      <div class="frame" id="frame">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <div class="thumb" id="thumb">
          <img id="thumbImg" class="viewport" alt="" hidden>
          <img id="thumbFull" alt="" hidden>
          <div class="sheet" id="sheet">
            <div class="ln w"></div><div class="ln"></div><div class="ln s"></div><div class="ln img"></div>
            <div class="ln"></div><div class="ln s"></div><div class="ln img"></div><div class="ln"></div>
          </div>
        </div>
        <div class="hl" id="hl"></div>
        <div class="timer" id="timer" hidden>
          <svg class="ring" viewBox="0 0 84 84">
            <circle class="track" cx="42" cy="42" r="39"/>
            <circle class="arc" id="arc" cx="42" cy="42" r="39" pathLength="1"/>
          </svg>
          <div class="num" id="num"></div>
          <div class="hint">Esc cancels</div>
        </div>
        <div class="flash"></div>
        <button class="chip" id="chip" title="Where the capture goes">
          <span id="chipIcon"></span><span id="chipLabel"></span>
          <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="chip-menu" id="chipMenu" hidden></div>
      </div>

      <div class="modes" id="modes">
        <div class="puck" id="puck"></div>
      </div>

      <button class="shutter" id="shutter"><span class="lbl" id="shutterLabel"></span></button>
    </section>

    <section class="face back">
      <header>
        <h1>
          <button class="iconbtn" id="backBtn" title="Back">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          Settings
        </h1>
      </header>
      <div class="opt">
        <label>Send to<small>Where captures go</small></label>
        <div class="seg" id="segOutput"></div>
      </div>
      <div class="opt">
        <label>File format<small>Clipboard is always PNG</small></label>
        <div class="seg" id="segFormat"></div>
      </div>
      <div class="opt stack" id="qualityRow">
        <label for="quality">Quality<small id="qualityValue"></small></label>
        <input type="range" id="quality" min="1" max="100">
      </div>
      <div class="opt">
        <label>Delay<small>Time to open menus first</small></label>
        <div class="seg" id="segDelay"></div>
      </div>
      <div class="opt">
        <label>Ask where to save</label>
        <button class="toggle" id="saveAsToggle" aria-pressed="true" title="Ask where to save"></button>
      </div>
      <div class="opt stack">
        <label for="template">File name</label>
        <input type="text" id="template" spellcheck="false" autocomplete="off">
        <div class="vars" id="vars"></div>
        <div class="preview" id="filenamePreview"></div>
      </div>
    </section>

  </div>
</div>

<script src="../content/settings.js"></script>
<script src="../content/utils.js"></script>
<script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>e2e: document scroller</title>
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; }
  /* Position-encoded grid: painted by script into #grid. */
  #grid { position: absolute; top: 0; left: 0; z-index: 0; }
  .layout { position: relative; z-index: 1; display: flex; }
  #sidebar {
    position: sticky; top: 0; align-self: flex-start;
    width: 180px; height: 100vh; background: rgb(255, 0, 0);
  }
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 48px;
    background: rgb(0, 0, 255); z-index: 10;
  }
  .content { flex: 1; height: 3600px; }
</style>
</head>
<body>
<canvas id="grid" width="1200" height="3600"></canvas>
<div id="topbar"></div>
<div class="layout">
  <nav id="sidebar"></nav>
  <main class="content"></main>
</div>
<script>
  // Each 16px cell's color encodes its page coordinate:
  // r = cellX + 1, g = cellY + 1, b = 64.
  const c = document.getElementById("grid");
  const ctx = c.getContext("2d");
  for (let cy = 0; cy * 16 < c.height; cy++) {
    for (let cx = 0; cx * 16 < c.width; cx++) {
      ctx.fillStyle = `rgb(${(cx + 1) & 255}, ${(cy + 1) & 255}, 64)`;
      ctx.fillRect(cx * 16, cy * 16, 16, 16);
    }
  }
  document.title += " [grid-ready]";
</script>
</body>
</html>

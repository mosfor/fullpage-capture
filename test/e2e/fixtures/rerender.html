<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>e2e: SPA re-render on scroll</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  .xk9 {
    position: absolute; top: 0; left: 0;
    width: 900px; height: 600px; overflow: auto;
  }
  .q2w { position: relative; width: 1100px; height: 3000px; }
  #grid { position: absolute; top: 0; left: 0; z-index: 0; }
  /* Sticky comes from the class, not inline style — like a real SPA. */
  .stick {
    position: sticky; top: 0; z-index: 1;
    width: 150px; height: 120px; background: rgb(255, 0, 0);
  }
</style>
</head>
<body>
<div class="xk9" id="container">
  <div class="q2w" id="inner">
    <canvas id="grid" width="1100" height="3000"></canvas>
    <div class="stick" id="sticky"></div>
  </div>
</div>
<script>
  const c = document.getElementById("grid");
  const ctx = c.getContext("2d");
  for (let cy = 0; cy * 16 < c.height; cy++) {
    for (let cx = 0; cx * 16 < c.width; cx++) {
      ctx.fillStyle = `rgb(${(cx + 1) & 255}, ${(cy + 1) & 255}, 64)`;
      ctx.fillRect(cx * 16, cy * 16, 16, 16);
    }
  }

  // Simulate a framework re-render: every scroll replaces the sticky node
  // with a brand-new element, discarding any inline styles a capture tool
  // set on the old one.
  document.getElementById("container").addEventListener("scroll", () => {
    const fresh = document.createElement("div");
    fresh.className = "stick";
    fresh.id = "sticky";
    document.getElementById("sticky").replaceWith(fresh);
  });

  document.title += " [grid-ready]";
</script>
</body>
</html>

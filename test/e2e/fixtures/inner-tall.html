<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>e2e: inner scroll container taller than the viewport</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: rgb(0, 128, 0); }
  #marker {
    position: absolute; top: 0; left: 0;
    width: 24px; height: 24px; background: rgb(255, 0, 255);
  }
  /* Client height 150vh: the container's client bottom sits BELOW the
     viewport, so side-strip continuation must sample the lowest strip rows
     actually captured on screen (regression for out-of-image clamp source). */
  .xk9 {
    position: absolute; top: 60px; left: 40px;
    width: 800px; height: 150vh;
    overflow: auto; border: 10px solid #000;
  }
  .q2w { position: relative; width: 1000px; height: 3000px; }
  #grid { position: absolute; top: 0; left: 0; z-index: 0; }
</style>
</head>
<body>
<div id="marker"></div>
<div class="xk9" id="container">
  <div class="q2w">
    <canvas id="grid" width="1000" height="3000"></canvas>
  </div>
</div>
<script>
  const c = document.getElementById("grid");
  const ctx = c.getContext("2d");
  for (let cy = 0; cy * 16 < c.height; cy++) {
    for (let cx = 0; cx * 16 < c.width; cx++) {
      ctx.fillStyle = `rgb(${(cx + 1) & 255}, ${(cy + 1) & 255}, 64)`;
      ctx.fillRect(cx * 16, cy * 16, 16, 16);
    }
  }
  document.title += " [grid-ready]";
</script>
</body>
</html>

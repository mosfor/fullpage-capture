<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>explore: sticky bar inside shadow DOM, inner scroll container</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #topbar { height: 48px; background: #222; color: #fff; font: 16px sans-serif;
            display: flex; align-items: center; padding-left: 12px; }
  #app { height: calc(100% - 48px); overflow: auto; }
</style>
</head>
<body>
<div id="topbar">page chrome header (must appear once)</div>
<div id="app"></div>
<script>
  const host = document.createElement("div");
  document.getElementById("app").appendChild(host);
  const root = host.attachShadow({ mode: "open" });
  root.innerHTML = `
    <style>
      .sticky { position: sticky; top: 0; height: 40px; background: rgb(255,0,0);
                color: #fff; font: 700 18px sans-serif; display: flex;
                align-items: center; padding-left: 12px; z-index: 5; }
      .row { height: 100px; font: 20px sans-serif; display: flex; align-items: center;
             padding-left: 12px; border-bottom: 1px solid #ccc; }
      .row:nth-child(odd) { background: #eef; }
    </style>
    <div class="sticky">STICKY-IN-SHADOW (must appear exactly once)</div>
  `;
  for (let i = 1; i <= 40; i++) {
    const r = document.createElement("div");
    r.className = "row";
    r.textContent = "shadow row " + i;
    root.appendChild(r);
  }
</script>
</body>
</html>

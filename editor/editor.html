<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Edit capture — FullPage Capture</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="toolbar" id="toolbar">
    <div class="group" id="tools">
      <button class="tool active" data-tool="select" title="Select / Pan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
        </svg>
      </button>
      <button class="tool" data-tool="crop" title="Crop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.13 1L6 16a2 2 0 0 0 2 2h15"/>
          <path d="M1 6.13L16 6a2 2 0 0 1 2 2v15"/>
        </svg>
      </button>
      <button class="tool" data-tool="rect" title="Rectangle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="1"/>
        </svg>
      </button>
      <button class="tool" data-tool="arrow" title="Arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="19" x2="19" y2="5"/>
          <polyline points="9 5 19 5 19 15"/>
        </svg>
      </button>
      <button class="tool" data-tool="text" title="Text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 7 4 4 20 4 20 7"/>
          <line x1="9" y1="20" x2="15" y2="20"/>
          <line x1="12" y1="4" x2="12" y2="20"/>
        </svg>
      </button>
      <button class="tool" data-tool="blur" title="Blur (pixelate)">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <rect x="4" y="4" width="5" height="5" rx="1"/>
          <rect x="15" y="4" width="5" height="5" rx="1" opacity="0.45"/>
          <rect x="4" y="15" width="5" height="5" rx="1" opacity="0.45"/>
          <rect x="15" y="15" width="5" height="5" rx="1"/>
          <rect x="9.5" y="9.5" width="5" height="5" rx="1" opacity="0.7"/>
        </svg>
      </button>
    </div>

    <div class="sep"></div>

    <div class="group" id="colors">
      <button class="swatch active" data-color="#e0533d" title="Red" style="background:#e0533d"></button>
      <button class="swatch" data-color="#4A90D9" title="Blue" style="background:#4A90D9"></button>
      <button class="swatch" data-color="#f2b01e" title="Yellow" style="background:#f2b01e"></button>
      <button class="swatch" data-color="#1a1a1a" title="Black" style="background:#1a1a1a"></button>
    </div>

    <div class="sep"></div>

    <div class="group" id="strokes">
      <button class="stroke" data-stroke="small" title="Small"><span style="width:4px;height:4px"></span></button>
      <button class="stroke active" data-stroke="medium" title="Medium"><span style="width:7px;height:7px"></span></button>
      <button class="stroke" data-stroke="large" title="Large"><span style="width:10px;height:10px"></span></button>
    </div>

    <div class="sep"></div>

    <div class="group">
      <button class="tool" id="undoBtn" title="Undo (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
        </svg>
      </button>
      <button class="tool" id="redoBtn" title="Redo (Ctrl+Shift+Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
    </div>

    <div class="spacer"></div>

    <div class="group">
      <button class="action" id="copyBtn" title="Copy to clipboard (Ctrl+C)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Copy
      </button>
      <button class="action primary" id="saveBtn" title="Save as file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Save
      </button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="canvas-wrap" id="canvasWrap" hidden>
      <canvas id="canvas"></canvas>
      <input type="text" id="textInput" spellcheck="false" autocomplete="off" hidden>
      <button id="cropApplyBtn" title="Apply crop (Enter)" hidden>✓</button>
    </div>
    <div class="empty" id="empty" hidden>
      <p>Nothing to edit.</p>
      <p class="hint">Capture with output set to “Edit” and it will open here.</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../content/settings.js"></script>
  <script src="../content/utils.js"></script>
  <script src="../content/pdf.js"></script>
  <script src="editor.js"></script>
</body>
</html>
